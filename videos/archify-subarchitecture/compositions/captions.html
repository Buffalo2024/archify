</style><div data-hf-id="hf-jcp1" id="root" data-composition-id="captions" data-width="1920" data-height="1080" data-duration="90.615"><div data-hf-id="hf-ib9l" class="bilingual-line" id="caption-0"><div data-hf-id="hf-i3rn" class="english">A complex system can be hard to read in one diagram.</div><div data-hf-id="hf-dn8e" class="chinese">复杂系统很难在一张图中清楚呈现。</div></div><div data-hf-id="hf-fc00" class="bilingual-line" id="caption-1"><div data-hf-id="hf-re26" class="english">Keep the overview clear.</div><div data-hf-id="hf-07mx" class="chinese">让概览保持清晰。</div></div><div data-hf-id="hf-q7hn" class="bilingual-line" id="caption-2"><div data-hf-id="hf-mk2z" class="english">Open a component when you need more detail.</div><div data-hf-id="hf-8hyg" class="chinese">需要更多细节时，再展开组件。</div></div><div data-hf-id="hf-m9dm" class="bilingual-line" id="caption-3"><div data-hf-id="hf-shnx" class="english">This is the Transformer example in Archify Labs.</div><div data-hf-id="hf-lmt2" class="chinese">这是 Archify Labs 中的 Transformer 示例。</div></div><div data-hf-id="hf-3hnx" class="bilingual-line" id="caption-4"><div data-hf-id="hf-lhpz" class="english">Select Transformer Layer and open its internal architecture.</div><div data-hf-id="hf-icgj" class="chinese">选择 Transformer Layer，然后打开内部架构。</div></div><div data-hf-id="hf-2q04" class="bilingual-line" id="caption-5"><div data-hf-id="hf-b5xk" class="english">The child expands below the main diagram.</div><div data-hf-id="hf-xowx" class="chinese">子图在主图下方展开。</div></div><div data-hf-id="hf-bdvz" class="bilingual-line" id="caption-6"><div data-hf-id="hf-mdzh" class="english">Its local components have their own Semantic Passport.</div><div data-hf-id="hf-9jic" class="chinese">局部组件有各自的 Semantic Passport。</div></div><div data-hf-id="hf-7fry" class="bilingual-line" id="caption-7"><div data-hf-id="hf-zba1" class="english">The Export menu offers two targets.</div><div data-hf-id="hf-njgq" class="chinese">Export 菜单提供两个导出目标。</div></div><div data-hf-id="hf-9qv5" class="bilingual-line" id="caption-8"><div data-hf-id="hf-8sfj" class="english">Main diagram exports the overview.</div><div data-hf-id="hf-dy6s" class="chinese">Main diagram 导出主图概览。</div></div><div data-hf-id="hf-8z7c" class="bilingual-line" id="caption-9"><div data-hf-id="hf-mbgs" class="english">Current subarchitecture exports only the open child.</div><div data-hf-id="hf-id05" class="chinese">Current subarchitecture 只导出当前子图。</div></div><div data-hf-id="hf-sdc8" class="bilingual-line" id="caption-10"><div data-hf-id="hf-9uzd" class="english">This child SVG contains seven local components.</div><div data-hf-id="hf-gs5a" class="chinese">这张子图 SVG 仅包含七个局部组件。</div></div><div data-hf-id="hf-t501" class="bilingual-line" id="caption-11"><div data-hf-id="hf-85st" class="english">The two exports stay independent.</div><div data-hf-id="hf-5cpd" class="chinese">两种导出彼此独立。</div></div><div data-hf-id="hf-x342" class="bilingual-line" id="caption-12"><div data-hf-id="hf-gdun" class="english">Use Back to model to return.</div><div data-hf-id="hf-40og" class="chinese">点击 Back to model 返回。</div></div><div data-hf-id="hf-1183" class="bilingual-line" id="caption-13"><div data-hf-id="hf-e2tl" class="english">The page restores your scroll position and parent selection.</div><div data-hf-id="hf-s0zk" class="chinese">页面恢复原来的滚动位置和父组件选择。</div></div><div data-hf-id="hf-djqk" class="bilingual-line" id="caption-14"><div data-hf-id="hf-9txt" class="english">Larger children can scroll.</div><div data-hf-id="hf-z5qd" class="chinese">较大的子图可以滚动查看。</div></div><div data-hf-id="hf-ebed" class="bilingual-line" id="caption-15"><div data-hf-id="hf-azcw" class="english">The main diagram keeps its original behavior.</div><div data-hf-id="hf-v7em" class="chinese">主图保留原有行为。</div></div><div data-hf-id="hf-i9ie" class="bilingual-line" id="caption-16"><div data-hf-id="hf-6lx6" class="english">The BAGEL example follows the official inference code.</div><div data-hf-id="hf-85hv" class="chinese">BAGEL 示例依据官方推理代码绘制。</div></div><div data-hf-id="hf-of87" class="bilingual-line" id="caption-17"><div data-hf-id="hf-bak0" class="english">Open context assembly to inspect text, vision, and VAE paths.</div><div data-hf-id="hf-l9dv" class="chinese">展开上下文组装，查看文本、视觉和 VAE 路径。</div></div><div data-hf-id="hf-0xqo" class="bilingual-line" id="caption-18"><div data-hf-id="hf-lyiq" class="english">Open the MoT layer to see attention and separate feed-forward paths.</div><div data-hf-id="hf-r9cp" class="chinese">展开 MoT 层，查看注意力和分别处理的前馈路径。</div></div><div data-hf-id="hf-1peh" class="bilingual-line" id="caption-19"><div data-hf-id="hf-k1vn" class="english">Source links point to a fixed repository revision.</div><div data-hf-id="hf-e2s7" class="chinese">源码链接指向固定的仓库版本。</div></div><div data-hf-id="hf-xixl" class="bilingual-line" id="caption-20"><div data-hf-id="hf-ftsj" class="english">The Lance example follows a dataset query.</div><div data-hf-id="hf-mqxe" class="chinese">Lance 示例展示数据集查询路径。</div></div><div data-hf-id="hf-wr9s" class="bilingual-line" id="caption-21"><div data-hf-id="hf-7q6v" class="english">Open the scanner to inspect its query plan.</div><div data-hf-id="hf-4xps" class="chinese">展开 Scanner，查看查询计划。</div></div><div data-hf-id="hf-7mrf" class="bilingual-line" id="caption-22"><div data-hf-id="hf-eo1x" class="english">Some stages depend on the query options.</div><div data-hf-id="hf-x24x" class="chinese">部分阶段由查询选项决定。</div></div><div data-hf-id="hf-1h1m" class="bilingual-line" id="caption-23"><div data-hf-id="hf-5k9s" class="english">Then open the Arrow stream bridge.</div><div data-hf-id="hf-k77n" class="chinese">再展开 Arrow 数据流桥接层。</div></div><div data-hf-id="hf-kwxp" class="bilingual-line" id="caption-24"><div data-hf-id="hf-d6xq" class="english">See how Rust batches reach Python.</div><div data-hf-id="hf-q7j9" class="chinese">查看 Rust 中的批次如何传到 Python。</div></div><div data-hf-id="hf-k59w" class="bilingual-line" id="caption-25"><div data-hf-id="hf-2jah" class="english">These views are optional additions in Labs.</div><div data-hf-id="hf-ovrq" class="chinese">这些视图是 Labs 中的可选增量功能。</div></div><div data-hf-id="hf-st5r" class="bilingual-line" id="caption-26"><div data-hf-id="hf-r5iq" class="english">Each child stays one level deep with up to twelve components.</div><div data-hf-id="hf-4nlp" class="chinese">子图仅支持一层，最多包含十二个组件。</div></div><div data-hf-id="hf-ov1q" class="bilingual-line" id="caption-27"><div data-hf-id="hf-9il9" class="english">Try Transformer, BAGEL, and Lance in the gallery.</div><div data-hf-id="hf-zcpj" class="chinese">在 Gallery 中体验 Transformer、BAGEL 和 Lance。</div></div><div data-hf-id="hf-oyj5" class="bilingual-line" id="caption-28"><div data-hf-id="hf-wjdc" class="english">Bring a real diagram and share what you find.</div><div data-hf-id="hf-olur" class="chinese">欢迎用真实架构图试用，并分享你的发现。</div></div></div><script>window.__timelines=window.__timelines||{};const tl=gsap.timeline({paused:true});tl.set("#caption-0",{opacity:1},0);tl.set("#caption-0",{opacity:0},3.563);tl.set("#caption-1",{opacity:1},3.723);tl.set("#caption-1",{opacity:0},5.195);tl.set("#caption-2",{opacity:1},5.355);tl.set("#caption-2",{opacity:0},7.979);tl.set("#caption-3",{opacity:1},8.139);tl.set("#caption-3",{opacity:0},11.36);tl.set("#caption-4",{opacity:1},11.52);tl.set("#caption-4",{opacity:0},15.531);tl.set("#caption-5",{opacity:1},15.691);tl.set("#caption-5",{opacity:0},18.422);tl.set("#caption-6",{opacity:1},18.582);tl.set("#caption-6",{opacity:0},21.782);tl.set("#caption-7",{opacity:1},21.942);tl.set("#caption-7",{opacity:0},24.353);tl.set("#caption-8",{opacity:1},24.513);tl.set("#caption-8",{opacity:0},27.009);tl.set("#caption-9",{opacity:1},27.169);tl.set("#caption-9",{opacity:0},30.881);tl.set("#caption-10",{opacity:1},31.041);tl.set("#caption-10",{opacity:0},34.667);tl.set("#caption-11",{opacity:1},34.827);tl.set("#caption-11",{opacity:0},37.025);tl.set("#caption-12",{opacity:1},37.185);tl.set("#caption-12",{opacity:0},39.126);tl.set("#caption-13",{opacity:1},3
